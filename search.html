<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Search Items - Campus Lost & Found Portal
    </title>

    <link rel="stylesheet"
          href="../css/style6.css">

</head>


<body>


    <!-- PORTAL HEADER -->

    <header class="portal-header">

        <div class="portal-logo">
            🏫
        </div>

        <div>
            <h1>
                Campus Lost&Found Portal
            </h1>

            
        </div>

    </header>



    <!--MAIN -->

    <main class="search-main">


        <!-- PAGE HEADER -->

        <section class="search-header">

            <div>

                <h1>
                    Search Items
                </h1>

                <p>
                    Search lost and found items reported
                    on campus.
                </p>

            </div>

        </section>



        <!-- SEARCH PANEL-->

        <section class="search-card">


            <!-- SEARCH BOX -->

            <div class="search-box">

                <label for="searchInput">
                    Search Item
                </label>

                <div class="search-input-row">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by item name, description or location..."
                    >

                    <button
                        type="button"
                        id="searchBtn">

                        🔎 Search

                    </button>

                </div>

            </div>



            <!-- FILTERS-->

            <div class="search-filters">


                <!-- TYPE -->

                <div class="filter-group">

                    <label for="typeFilter">
                        Type
                    </label>

                    <select id="typeFilter">

                        <option value="all">
                            All
                        </option>

                        <option value="LOST">
                            Lost
                        </option>

                        <option value="FOUND">
                            Found
                        </option>

                    </select>

                </div>



                <!-- CATEGORY -->

                <div class="filter-group">

                    <label for="categoryFilter">
                        Category
                    </label>

                    <select id="categoryFilter">

                        <option value="all">
                            All Categories
                        </option>

                        <option value="Mobile">
                            Mobile
                        </option>

                        <option value="Wallet">
                            Wallet
                        </option>

                        <option value="ID Card">
                            ID Card
                        </option>

                        <option value="Keys">
                            Keys
                        </option>

                        <option value="Bag">
                            Bag
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Clothing">
                            Clothing
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- STATUS -->

                <div class="filter-group">

                    <label for="statusFilter">
                        Status
                    </label>

                    <select id="statusFilter">

                        <option value="all">
                            All Status
                        </option>

                        <option value="LOST">
                            Lost
                        </option>

                        <option value="FOUND">
                            Found
                        </option>

                        <option value="VERIFIED">
                            Verified
                        </option>

                        <option value="RETURNED">
                            Returned
                        </option>

                    </select>

                </div>

            </div>


        </section>



        <!--RESULTS HEADER -->

       <!-- <section class="results-header">

            <div>

                <h2>
                    Search Results
                </h2>

                <p id="resultCount">
                    0 items found
                </p>

            </div>

        </section>-->



        <!-- 
             RESULTS
            -->

       <!--<section
            id="searchResults"
            class="search-results">


            <div class="empty-results">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    No Search Performed
                </h3>

                <p>
                    Search for an item to see
                    available reports.
                </p>

            </div> 


        </section>-->


    </main>



    <!-- ITEM DETAILS MODAL -->

    <div
        id="itemModal"
        class="item-modal"
    >

        <div class="item-modal-content">


            <button
                type="button"
                class="modal-close"
                onclick="closeItemModal()">

                ×

            </button>


            <h2>
                Item Details
            </h2>


            <div id="itemDetails">

                <!-- Loaded by JavaScript -->

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="close-btn"
                    onclick="closeItemModal()">

                    Close

                </button>

            </div>

        </div>

    </div>



    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">


        <a
            href="dashboard.html"
            class="nav-item"
        >

            <span>
                🏠
            </span>

            <small>
                Home
            </small>

        </a>


        <a
            href="search.html"
            class="nav-item active"
        >

            <span>
                🔎
            </span>

            <small>
                Search
            </small>

        </a>


        <a
            href="claims.html"
            class="nav-item"
        >

            <span>
                🤝
            </span>

            <small>
                Claims
            </small>

        </a>


        <a
            href="notifications.html"
            class="nav-item"
        >

            <span>
                🔔
            </span>

            <small>
                Alerts
            </small>

        </a>


        <a
            href="#"
            class="nav-item"
            onclick="logout(); return false;"
        >

            <span>
                🚪
            </span>

            <small>
                Logout
            </small>

        </a>

    </nav>



    <!--JAVASCRIPT -->

    <script src="../JS/db.js"></script>

    <script src="../JS/auth.js"></script>

    <script src="../JS/search.js"></script>


</body>

</html>
