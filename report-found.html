<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Found - Campus Lost & Found Portal</title>

    <link rel="stylesheet"
          href="../css/style17.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="portal-header">

        <div class="portal-logo">
            🏫
        </div>

        <div>
            <h1 style="color: #7c3aed;">Campus Lost&Found Portal</h1>
        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="report-container">

        <div class="report-card">

            <div class="report-icon">
                📦
            </div>

            <h1>Report Found Item</h1>

            <p class="report-subtitle">
                Tell us about the item you found on campus.
            </p>


            <div id="message"></div>


            <form id="foundReportForm">


                <!-- ================= ITEM NAME ================= -->

                <div class="input-group">

                    <label for="foundItemName">
                        Item Name *
                    </label>

                    <input
                        type="text"
                        id="foundItemName"
                        placeholder="e.g. Black Wallet"
                        required
                    >

                </div>


                <!-- ================= CATEGORY ================= -->

                <div class="input-group">

                    <label for="foundCategory">
                        Category *
                    </label>

                    <select
                        id="foundCategory"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Mobile">
                            📱 Mobile
                        </option>

                        <option value="Wallet">
                            👛 Wallet
                        </option>

                        <option value="ID Card">
                            🪪 ID Card
                        </option>

                        <option value="Keys">
                            🔑 Keys
                        </option>

                        <option value="Bag">
                            🎒 Bag
                        </option>

                        <option value="Books">
                            📚 Books
                        </option>

                        <option value="Electronics">
                            💻 Electronics
                        </option>

                        <option value="Clothing">
                            👕 Clothing
                        </option>

                        <option value="Accessories">
                            👜 Accessories
                        </option>

                        <option value="Other">
                            📦 Other
                        </option>

                    </select>

                </div>


                <!-- ================= DATE ================= -->

                <div class="input-group">

                    <label for="foundDate">
                        Date Found *
                    </label>

                    <input
                        type="date"
                        id="foundDate"
                        required
                    >

                </div>


                <!-- ================= LOCATION ================= -->

                <div class="input-group">

                    <label for="foundLocation">
                        Found Location *
                    </label>

                    <select
                        id="foundLocation"
                        required
                    >

                        <option value="">
                            Select Location
                        </option>

                        <option value="Library">
                            📚 Library
                        </option>

                        <option value="Canteen">
                            🍽️ Canteen
                        </option>

                        <option value="Classroom">
                            🏫 Classroom
                        </option>

                        <option value="Laboratory">
                            💻 Laboratory
                        </option>

                        <option value="Parking">
                            🚗 Parking
                        </option>

                        <option value="Playground">
                            ⚽ Playground
                        </option>

                        <option value="Security Desk">
                            🛡️ Security Desk
                        </option>

                        <option value="Other">
                            📍 Other
                        </option>

                    </select>

                </div>


                <!-- ================= DESCRIPTION ================= -->

                <div class="input-group">

                    <label for="foundDescription">
                        Item Description *
                    </label>

                    <textarea
                        id="foundDescription"
                        rows="4"
                        placeholder="Describe colour, brand, marks, condition, etc."
                        required
                    ></textarea>

                </div>


                <!-- ================= STORAGE LOCATION ================= -->

                <div class="input-group">

                    <label for="storageLocation">
                        Storage Location
                    </label>

                    <input
                        type="text"
                        id="storageLocation"
                        placeholder="e.g. Security Desk / Locker A-02"
                    >

                </div>


                <!-- ================= PHOTO ================= -->

                <div class="input-group">

                    <label for="foundItemImage">
                        Item Photo
                    </label>

                    <input
                        type="file"
                        id="foundItemImage"
                        accept="image/*"
                    >

                    <div id="foundImagePreview"></div>

                </div>


                <!-- ================= SUBMIT ================= -->

                <button
                    type="submit"
                    id="submitFoundReport"
                    class="auth-btn">

                    Submit Found Report

                </button>


            </form>

        </div>

    </main>


    <!-- ================= BOTTOM NAVIGATION ================= -->

    <nav class="bottom-nav">

        <a
            href="dashboard.html"
            class="nav-item">

            <span>🏠</span>
            <small>Home</small>

        </a>


        <a
            href="search.html"
            class="nav-item">

            <span>🔎</span>
            <small>Search</small>

        </a>


        <a
            href="claims.html"
            class="nav-item">

            <span>🤝</span>
            <small>Claims</small>

        </a>


        <a
            href="notifications.html"
            class="nav-item">

            <span>🔔</span>
            <small>Alerts</small>

        </a>

    </nav>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../JS/db.js"></script>

    <script src="../JS/auth.js"></script>

    <script src="../JS/student.js"></script>

</body>

</html>
