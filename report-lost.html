<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost - Campus Lost&Found Portal</title>

    <link rel="stylesheet" href="../css/style3.css">
</head>

<body>

<!-- HEADER -->

<header class="portal-header">
    <div class="portal-logo">🏫</div>
    <div>
        <h1>Campus Lost&Found Portal</h1>
        
    </div>
</header>
 
    </a>

</header>

<!-- MAIN -->

<main class="report-container">

    <div class="report-card">

        <div class="report-icon">
            🔴
        </div>

        <h1>Report Lost Item</h1>

        <p class="report-subtitle">
            Tell us about the item you lost on campus.
        </p>

        <div id="message"></div>

        <form id="reportForm">

            <!-- ITEM NAME -->

            <div class="input-group">

                <label>
                    Item Name *
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="e.g. Black Wallet"
                    required>

            </div>

            <!-- CATEGORY -->

            <div class="input-group">

                <label>
                    Category *
                </label>

                <select id="category" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Mobile">
                        📱 Mobile
                    </option>

                    <option value="Wallet">
                        👛 Wallet
                    </option>

                    <option value="ID Card">
                        🪪 ID Card
                    </option>

                    <option value="Keys">
                        🔑 Keys
                    </option>

                    <option value="Bag">
                        🎒 Bag
                    </option>

                    <option value="Books">
                        📚 Books
                    </option>

                    <option value="Electronics">
                        💻 Electronics
                    </option>

                    <option value="Other">
                        📦 Other
                    </option>

                </select>

            </div>

            <!-- DATE -->

            <div class="input-group">

                <label>
                    Date Lost *
                </label>

                <input
                    type="date"
                    id="lostDate"
                    required>

            </div>

            <!-- LOCATION -->

            <div class="input-group">

                <label>
                    Last Seen Location *
                </label>

                <select id="location" required>

                    <option value="">
                        Select Location
                    </option>

                    <option value="Library">
                        📚 Library
                    </option>

                    <option value="Canteen">
                        🍽️ Canteen
                    </option>

                    <option value="Classroom">
                        🏫 Classroom
                    </option>

                    <option value="Laboratory">
                        💻 Laboratory
                    </option>

                    <option value="Parking">
                        🚗 Parking
                    </option>

                    <option value="Playground">
                        ⚽ Playground
                    </option>

                    <option value="Security Desk">
                        🛡️ Security Desk
                    </option>

                    <option value="Other">
                        📍 Other
                    </option>

                </select>

            </div>

            <!-- DESCRIPTION -->

            <div class="input-group">

                <label>
                    Item Description *
                </label>

                <textarea
                    id="description"
                    rows="4"
                    placeholder="Describe the item's colour, brand, unique marks, etc."
                    required
                ></textarea>

            </div>

            <!-- OPTIONAL IMAGE -->

            <div class="input-group">

                <label>
                    Item Photo
                </label>

                <input
                    type="file"
                    id="itemImage"
                    accept="image/*">
                
                <div id="imagePreview"></div>

            </div>

            <!-- SUBMIT -->

            <button
                type="submit"
                id="submitReport"
                class="auth-btn">

                Submit Lost Report

            </button>

        </form>

    </div>

</main>
