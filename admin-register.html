<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Registration - Campus Lost&Found Portal</title>

    <link rel="stylesheet" href="../css/style16.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo-circle">🏫</div>

        <h1>Campus Lost & Found Portal</h1>

        <p class="subtitle">Create Admin Account</p>

        <div id="message"></div>

        <form id="adminRegisterForm">

            <!-- NAME -->

            <div class="input-group">

                <label>Admin Name</label>

                <input
                    type="text"
                    id="adminName"
                    placeholder="Enter admin name"
                    required>

            </div>

            <!-- ADMIN ID -->

            <div class="input-group">

                <label>Admin ID</label>

                <input
                    type="text"
                    id="adminId"
                    placeholder="Enter admin ID"
                    required>

            </div>

            <!-- EMAIL -->

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required >

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Create password"
                    minlength="6"
                    required>

            </div>

            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="adminConfirmPassword"
                    placeholder="Confirm password"
                    minlength="6"
                    required>

            </div>

            <!-- SUBMIT -->

            <button
                type="submit"
                class="auth-btn">

                Create Admin Account

            </button>

        </form>

        <p class="bottom-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>

<script src="../JS/db.js"></script>
<script src="../JS/auth.js"></script>

</body>
</html>
